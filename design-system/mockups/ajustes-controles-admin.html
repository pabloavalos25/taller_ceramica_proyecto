<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUYAI · Ajustes de controles</title><link rel="stylesheet" href="../tokens.css"><style>
.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.side{padding:28px 18px;background:#fff;border-right:1px solid var(--border)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:36px}.brand img{width:60px;height:60px;border-radius:50%}.brand strong{display:block;font:400 25px var(--title);letter-spacing:.12em}.brand small{font-size:10px;color:var(--muted)}.eyebrow{color:var(--sage);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.nav{display:grid;gap:5px;margin-top:14px}.nav span{padding:12px;color:#4f5952;font-size:14px}.nav .current{border-radius:9px;background:#eef2ec;box-shadow:inset 3px 0 var(--sage)}.logout{position:relative;isolation:isolate;overflow:hidden;min-height:50px;margin-top:16px;padding:11px 22px;border:2px solid #E7A7A7;border-radius:50px;background:#fff;color:#6e3131;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.logout:before,.logout:after{content:'';position:absolute;inset:0;z-index:-1;background:#E7A7A7;transform:translateY(-105%);transition:transform .35s}.logout:before{opacity:.5}.logout:after{transition-delay:.15s}.logout:hover:before,.logout:hover:after,.logout:focus-visible:before,.logout:focus-visible:after{transform:translateY(0)}main{padding:32px 36px;max-width:1100px}h1{font:400 clamp(34px,4vw,44px)/1.1 var(--title)}h2{font:400 26px var(--title);margin:0 0 12px}.card{margin:18px 0;padding:24px;border:1px solid var(--border);border-radius:14px;background:#fff}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}label{display:grid;align-content:start;gap:6px;color:var(--text);font-size:14px;font-weight:600}input,select{min-height:46px;width:100%;padding:10px 12px;border:1px solid #d8ddd5;border-radius:8px;background:white;color:var(--text);font:inherit;font-weight:400}.hint{font-size:12px;font-weight:400;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:12px}.action{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 16px;border:1px solid #d8ddd5;border-radius:9px;color:var(--green);background:#fff;font-weight:700;font-size:14px;text-decoration:none}.notice{color:var(--muted);font-size:13px}@media(max-width:700px){.layout{display:block}.side{padding:16px;border:0;border-bottom:1px solid var(--border)}.brand{margin-bottom:14px}.brand img{width:42px;height:42px}.nav{display:flex;align-items:center;overflow-x:auto;white-space:nowrap}.logout{margin:0 0 0 12px;flex:none}main{padding:24px 18px}.fields{grid-template-columns:1fr}.card{padding:20px}}@media(prefers-reduced-motion:reduce){.logout:before,.logout:after{transition:none}}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><img src="../assets/logo.png" alt="Logo de SUYAI"><div><strong data-brand-name>SUYAI</strong><small>Multiespacio cultural</small></div></div><span class="eyebrow">Administración</span><nav class="nav" aria-label="Navegación de ejemplo"><span>Inicio</span><span>Alumnas</span><span>Hornos</span><span>Pagos</span><span class="current">Configuración</span><button class="logout" type="button">Cerrar sesión</button></nav></aside><main><span class="eyebrow">Muestra de controles</span><h1>Detalles del panel</h1><p class="notice">Propuesta visual: los controles son ejemplos y no modifican datos.</p><section class="card"><h2>Nueva alumna</h2><div class="fields"><label>Contraseña inicial<input type="password" value="contraseña-ejemplo"><span class="hint">Mínimo 12 caracteres. La alumna deberá cambiarla al ingresar.</span></label><label>Estado administrativo<select><option>Activa</option><option>Inactiva</option></select></label></div></section><section class="card"><h2>Nueva carga de horno</h2><div class="actions"><a class="action" href="#">Volver al historial</a><a class="action" href="#">Borradores compartidos</a></div></section><section class="card"><h2>Historial de pagos</h2><div class="fields"><label>Buscar alumna<input type="search" placeholder="Nombre o correo"></label><label>Estado<select><option>Todos</option><option>Registrados</option><option>Anulados</option></select></label></div></section></main></div><script src="../brand.js"></script></body></html>
