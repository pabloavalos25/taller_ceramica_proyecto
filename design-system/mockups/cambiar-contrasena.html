<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUYAI — Cambiar contraseña · Mockup</title><link rel="stylesheet" href="../tokens.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:32px 20px}.panel{width:min(100%,480px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(24px,5vw,40px)}.logo{display:block;width:96px;height:auto;margin:0 auto 26px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.7rem;font-weight:700;text-align:center;color:var(--muted)}h1{font:400 clamp(2.4rem,6vw,3rem)/1.1 var(--title);margin:12px 0;text-align:center}.intro{color:var(--muted);text-align:center;margin:0 0 26px}.field{display:grid;gap:7px;margin:18px 0;font-size:.92rem;font-weight:600}.field input{font:inherit;font-weight:400;border:1px solid #737c70;border-radius:8px;padding:12px 14px;min-height:48px}.hint{font-size:.85rem;color:var(--muted);font-weight:400;margin-top:2px}.button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:13px 16px;min-height:48px;width:100%;background:var(--green);color:white;margin-top:8px}.help{font-size:.85rem;color:var(--muted);margin:24px 0 0}.note{margin-top:24px;padding-top:16px;border-top:1px solid var(--border);font-size:.8rem;color:var(--muted)}@media(max-width:550px){body{padding:20px 16px;align-items:start}.panel{margin-top:12px;box-shadow:none}}</style></head><body><main class="panel"><img class="logo" src="../assets/logo.png" alt="SUYAI – Multiespacio Cultural"><div class="eyebrow">Tu cuenta · Seguridad</div><h1>Creá una nueva contraseña</h1><p class="intro">Por seguridad, cambiá la contraseña inicial antes de continuar.</p><form onsubmit="return false"><label class="field">Contraseña actual<input type="password" autocomplete="current-password" placeholder="Ingresá tu contraseña actual"></label><label class="field">Nueva contraseña<input type="password" autocomplete="new-password" placeholder="Elegí una nueva contraseña"><span class="hint">Usá al menos 12 caracteres.</span></label><label class="field">Repetir nueva contraseña<input type="password" autocomplete="new-password" placeholder="Repetí la nueva contraseña"></label><button class="button" type="submit">Guardar contraseña</button></form><p class="help">Al guardar, cerraremos tus sesiones y podrás ingresar con tu nueva contraseña.</p><p class="note">Vista de diseño: los controles son ilustrativos y todavía no cambian la contraseña.</p></main></body></html>
